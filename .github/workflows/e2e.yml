name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: E2E iOS
    runs-on: macos-26
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - name: Free runner disk space
        run: |
          # Full iOS builds + DerivedData can exhaust the runner disk
          # (clang dies with "IO failure on output stream"); drop every
          # Xcode except the selected one.
          df -h /
          SELECTED=$(xcode-select -p)
          for x in /Applications/Xcode*.app; do
            d="$x/Contents/Developer"
            [ "$d" = "$SELECTED" ] || sudo rm -rf "$x"
          done
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Expo prebuild
        uses: actions/cache@v6
        with:
          path: |
            ios/
            android/
          key: expo-prebuild-${{ hashFiles('app.config.ts', 'package.json') }}

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Setup CocoaPods cache
        uses: actions/cache@v6
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install CocoaPods
        run: cd ios && pod install

      # macos-26 defaults to Xcode 26.6, which compiles expo-modules-jsi
      # 57.1.0 unpatched (Swift 6.2.x in Xcode 26.2/26.3 rejects the
      # SWIFT_RETURNS_RETAINED RuntimeScheduler ctors — expo/expo#50067).
      #
      # Build the RELEASE configuration: RN's "Bundle React Native code and
      # images" phase embeds main.jsbundle at build time. The DEBUG config
      # needs Metro at runtime — CI starts none, so the app sat on the
      # expo-dev-launcher screen with no JS and every test died with
      # "app is busy / has not responded" (run 35949292281: 41/41 failed).
      - name: Detox build iOS
        run: pnpm exec detox build --configuration ios.sim.release

      # Rebuild the prebuilt Detox.framework against the active Xcode;
      # otherwise every test suite dies at validation with
      # "Detox.framework could not be found … you changed a version of Xcode".
      - name: Build Detox framework cache
        run: pnpm exec detox clean-framework-cache && pnpm exec detox build-framework-cache

      # Detox biometric/permission helpers need applesimutils; the macos-26
      # image does not preinstall it (macos-15 did).
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils

      - name: Boot iOS Simulator
        run: |
          # Runner images rotate simulator names (iPhone 15 disappeared with
          # an Xcode update), so pick whatever iPhone the image actually has
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/ *\([^)]*\)//g' | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "Booting simulator: $DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"

      - name: Detox test iOS
        run: pnpm exec detox test --configuration ios.sim.release --take-screenshots all

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios-artifacts
          path: |
            artifacts/
            ios/build/Build/Products/
          retention-days: 7

  e2e-android:
    name: E2E Android
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Expo prebuild
        uses: actions/cache@v6
        with:
          path: |
            ios/
            android/
          key: expo-prebuild-${{ hashFiles('app.config.ts', 'package.json') }}

      - name: Expo prebuild Android
        env:
          SIP_E2E_DISABLE_UPDATES: '1'
        run: npx expo prebuild --platform android --clean

      - name: Cache Gradle (restore)
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # HAZARD: hashFiles returns '' if the wrapper props file is ever
          # missing — the key collapses to bare `gradle-v3-`, which exact-hits
          # the first restore-keys prefix and would freeze stale content while
          # LOOKING like a hit. A bare `gradle-v3-` key in run logs is a red
          # flag, not a cache hit.
          key: gradle-v3-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v3-
            gradle-v2-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Template gradle.properties pins the daemon to -Xmx2048m; the
      # :expo:packageDebugAndroidTest splitter dies cause-less on CI with a
      # null-message OOM signature. Locally the identical command passes with
      # a larger heap (androidTest merge/dex tasks are the pressure point).
      # Task-output caching (build-cache-1, already inside the Gradle cache
      # path) is what actually stops the RN module compiles from rerunning —
      # without it the ~/.gradle/caches restore only saves dependency fetch.
      - name: Tune Gradle daemon (heap + task cache)
        run: |
          printf '\norg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g\n' >> android/gradle.properties
          printf 'org.gradle.caching=true\n' >> android/gradle.properties

      # Witness the BUILD phase. Rounds 11-14 all died during gradle build
      # (two graceful shutdown signals at ~47 min after 9-16 min task
      # stalls; one hard loss at ~75 min that also ate the log blob and
      # post steps) — the watcher used to start only at the test step, so
      # every death was unwitnessed. Samples free/ps/df/dmesg every 5s for
      # 90 min; uploads via the on-failure artifact step. 90 min also
      # covers the test phase, so only one watcher runs per job.
      - name: Resource watcher (diagnostic)
        run: |
          nohup bash -c 'for _ in $(seq 1 1080); do { date -u +%H:%M:%S; df -m / | sed -n 2p; free -m | sed -n 2p; ps -eo rss,comm --sort=-rss | head -6; sudo dmesg | tail -2; } >> "$GITHUB_WORKSPACE/resource-watch.log"; sleep 5; done' > /dev/null 2>&1 &
          echo "resource watcher started (covers build + test, 90 min)"

      - name: Detox build Android
        id: build
        # Builds the dedicated `e2e` variant (release-like, embedded JS
        # bundle, no dev-launcher, no R8) + the matching Detox androidTest APK.
        run: pnpm exec detox build --configuration android.emu.e2e

      # The runner's preinstalled cmdline-tools predate SDK repository XML v4
      # and their avdmanager cannot create the 'Pixel 7' profile ("No device
      # found matching"). Installing cmdline-tools;latest lands in latest-2
      # (PATH still resolves the old one), so create the AVD explicitly with
      # the new binary and let the emulator-runner action boot it.
      - name: Create AVD
        run: |
          # Old cmdline-tools can't read SDK XML v4; install the current
          # ones (they land in latest-2 when latest preexists), then use
          # the NEWEST sdkmanager/avdmanager for everything below.
          SDKM_OLD=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | sort -V | tail -1)
          yes | "$SDKM_OLD" --licenses > /dev/null || true
          "$SDKM_OLD" --install "cmdline-tools;latest" > /dev/null
          BIN=$(ls -d "$ANDROID_HOME"/cmdline-tools/latest* | sort -V | tail -1)/bin
          "$BIN/sdkmanager" --install "system-images;android-34;google_apis;x86_64" > /dev/null
          DEVARGS=()
          if "$BIN/avdmanager" list device | grep -q 'pixel_7'; then
            DEVARGS=(--device pixel_7)
          fi
          echo no | "$BIN/avdmanager" create avd --force -n Pixel_7_API_34 \
            --package "system-images;android-34;google_apis;x86_64" "${DEVARGS[@]}"
          "$BIN/avdmanager" list avd
          # New cmdline-tools write AVDs to ~/.config/.android/avd (they ignore
          # the runner's ANDROID_AVD_HOME=~/.android/avd), but the
          # emulator-runner action checks $ANDROID_AVD_HOME/<name>.avd with the
          # OLD avdmanager and, finding nothing, silently re-creates a
          # generic-profile AVD (320x640@160 — observed in run 35947871761).
          # Point both env vars at the new location so the action's
          # exists-check finds our pixel_7 AVD and boots it as-is.
          echo "ANDROID_USER_HOME=$HOME/.config/.android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> "$GITHUB_ENV"

      # The gradle daemon holds several GB after the build; free it before the
      # emulator boots (run 35947871761 lost its runner to a shutdown signal
      # ~2 min into emulator startup, with 3 java daemons + qemu + netsimd
      # alive; reproduced identically on main in run 36077820381 with 2 java
      # daemons — 62s of total runner log freeze, then forced shutdown).
      - name: Stop build daemons
        run: |
          cd android && ./gradlew --stop
          # Kotlin compile daemon is a separate JVM that outlives gradlew --stop
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Detox test Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          avd-name: Pixel_7_API_34
          # Without a profile the AVD defaults to a 320x640 @160dpi skin —
          # half the app UI (send numpad/CTA, home quick actions) sits below
          # the fold and Detox's 75%/90% visibility rules reject it (runs
          # 36554883668/36570652998/36583704678). Test on a real phone
          # geometry instead.
          profile: pixel_7
          script: |
            # The e2e variant embeds its JS bundle, so no Metro is needed.
            # 8099 must reach the host for the Detox websocket server; the
            # runner's detox-owned adb reverse has been unreliable (run
            # 36212228295: "Emulator version detection failed"), so bridge
            # it explicitly inside the emulator session.
            adb devices -l
            adb reverse tcp:8099 tcp:8099
            # Gesture nav turns a swipe that starts near the bottom screen
            # edge into the HOME action — Detox scroll gestures start there,
            # so scrolling backgrounded the app mid-suite (run 36583704678:
            # every settings test using scrollDown failed, app found on the
            # launcher). Three-button nav (navigation_mode 0) removes the
            # edge gesture; `cmd overlay enable` throws on some API levels.
            adb shell settings put secure navigation_mode 0
            # The keyguard may already be UP when this script runs: the
            # emulator boots in the action's emulator phase and its default
            # screen timeout can fire before our keep-awake lands. stayon
            # keeps the screen ON but never dismisses an existing keyguard —
            # run 36647475658: every suite failed with has-window-focus=false
            # for the whole job because the keyguard held window focus from
            # the first test on (earlier runs only recovered when a later
            # launchApp happened to wake the device — a race this run lost).
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # ANR armor (run 36809938508: "Pixel Launcher isn't responding"
            # dialog covered the app for a whole suite — CI emulator CPU
            # starvation ANRs system apps intermittently). hide_error_dialogs
            # suppresses ANR/crash dialogs where supported; disabling the
            # launcher removes the most frequent ANR source entirely (the
            # emulator needs no launcher — tests start activities directly).
            adb shell settings put global hide_error_dialogs 1
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            # The CI emulator locks on its screen timeout whenever a test
            # stalls: in run 36554883668 five settings tests executed against
            # the lock screen ("No activities in stage RESUMED",
            # has-window-focus=false) and recovered only when a later
            # launchApp woke the device. Keep it awake for the whole run.
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            pnpm e2e:test:android:e2e

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-artifacts
          path: |
            artifacts/
            android/app/build/outputs/
            resource-watch.log
          retention-days: 7

      - name: Cache Gradle (save)
        # actions/cache's combined `save-always` input is inert (v6 deprecates
        # it as "does not work as intended"; rounds 14-15 proved nothing was
        # banked). This split save step is the supported way to bank completed
        # task outputs (build-cache-1) from FAILED runs — and from cancels
        # only inside the ~5-min post-step grace the runner allows; anything
        # harder (runner reclaim, agent gone) still banks nothing — the
        # runner reclaims of rounds 11-14 died mid-build, and a banked
        # build-cache-1 is what lets the next dispatch resume warm.
        # Placed at JOB END so ~/.gradle/caches contains the build's task
        # outputs (a pre-build save would bank only the just-restored content
        # and freeze the v3 key at v2 content — exact hits would then skip all
        # future saves). `cache-hit` is true only on an EXACT primary-key hit;
        # a restore-keys fallback (v2 content) still saves under the v3 key.
        # steps.build.outcome is 'skipped' when a PRE-build step fails
        # (KVM/daemon/watcher) — restoring fallback content and then banking
        # it under v3 would freeze the key at v2 content, so only save when
        # the build actually RAN (a build that ran and FAILED still banks its
        # task outputs). Hard runner death still saves nothing — known limit.
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
